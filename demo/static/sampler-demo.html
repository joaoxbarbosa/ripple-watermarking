<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sampler Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Same tokens as the main page (demo/index.html) */
  :root {
    --bg: #ffffff; --ink: #000000; --muted: #6b6b6b; --faint: #a3a3a3;
    --line: #000000; --hair: #e5e5e5; --field: #fafafa; --heat: 0, 0, 0;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a2e86; --ink: #f3f7ff; --muted: #aec4f5; --faint: #6688d4;
      --line: #6f93e6; --hair: #2550b0; --field: #0d3796; --heat: 205, 222, 255;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a2e86; --ink: #f3f7ff; --muted: #aec4f5; --faint: #6688d4;
    --line: #6f93e6; --hair: #2550b0; --field: #0d3796; --heat: 205, 222, 255;
  }
  * { box-sizing: border-box; border-radius: 0; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -0.04em; margin: 0 0 8px; line-height: 1.05; }
  .sub { color: var(--muted); margin: 0 0 28px; max-width: 620px; }
  button { font: 500 13px var(--sans); border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 8px 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  button:disabled { opacity: .4; cursor: default; }
  input[type=range] { accent-color: var(--ink); }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  .meta { font: 12px var(--mono); color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="meta">Recorded from Qwen3-VL-4B-Instruct (MLX) · "Write a short story about a lighthouse keeper."</span>
    <button id="theme">Toggle theme</button></div>
  <h1>Inside the sampler</h1>
  <p class="sub">Watch each token get picked. The fingerprint never changes what the model wants. It only decides which random draws the race uses.</p>
  <div id="viz"></div>
</div>
<script src="/static/sampler.js"></script>
<script>
  document.getElementById("theme").onclick = () => {
    const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  };
  fetch("/static/sampler-trace.json").then(r => r.json()).then(t => SamplerViz.mount(document.getElementById("viz"), t));
</script>
</body>
</html>
