<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sampler Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Same tokens as the main page (demo/index.html) */
  :root {
    --bg: #ffffff; --ink: #000000; --muted: #6b6b6b; --faint: #a3a3a3;
    --line: #000000; --hair: #e5e5e5; --field: #fafafa; --heat: 0, 0, 0;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a2e86; --ink: #f3f7ff; --muted: #aec4f5; --faint: #6688d4;
      --line: #6f93e6; --hair: #2550b0; --field: #0d3796; --heat: 205, 222, 255;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a2e86; --ink: #f3f7ff; --muted: #aec4f5; --faint: #6688d4;
    --line: #6f93e6; --hair: #2550b0; --field: #0d3796; --heat: 205, 222, 255;
  }
  * { box-sizing: border-box; border-radius: 0; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -0.04em; margin: 0 0 8px; line-height: 1.05; }
  .sub { color: var(--muted); margin: 0 0 28px; max-width: 620px; }
  button { font: 500 13px var(--sans); border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 8px 12px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  button:disabled { opacity: .4; cursor: default; }
  input[type=range] { accent-color: var(--ink); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 28px; }
  .meta { font: 12px var(--mono); color: var(--muted); }
  .live { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto auto; gap: 8px; margin: 0 0 22px; }
  .live select, .live input[type=text] { font: 13px var(--sans); color: var(--ink); background: var(--field); border: 1px solid var(--line); padding: 10px 12px; min-width: 0; }
  .live select { font-family: var(--mono); -webkit-appearance: none; appearance: none; }
  .live label { display: flex; align-items: center; gap: 8px; font-size: 13px; border: 1px solid var(--line); padding: 0 12px; white-space: nowrap; cursor: pointer; }
  .live label input { accent-color: var(--ink); }
  .live button.go { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; padding: 10px 18px; }
  .live button.go:hover:not(:disabled) { background: var(--bg); color: var(--ink); }
  .status { font: 12px var(--mono); color: var(--muted); margin: -12px 0 22px; min-height: 18px; }
  @media (max-width: 760px) { .live { grid-template-columns: 1fr 1fr; } .live select, .live input[type=text] { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="meta" id="meta">Example recorded from Qwen3-VL-4B-Instruct (MLX) · "Write a short story about a lighthouse keeper."</span>
    <button id="theme">Toggle theme</button></div>
  <h1>Inside the sampler</h1>
  <p class="sub">Watch each token get picked, live as the model streams it. The fingerprint never changes what the model wants. It only decides which random draws the race uses.</p>
  <div class="live">
    <select id="model" aria-label="Model"></select>
    <input type="text" id="prompt" aria-label="Prompt" value="Write a short story about a lighthouse keeper.">
    <label><input type="checkbox" id="wm" checked> Fingerprint</label>
    <button class="go" id="go">Stream →</button>
  </div>
  <div class="status" id="status"></div>
  <div id="viz"></div>
</div>
<script src="/static/sampler.js"></script>
<script>
  document.getElementById("theme").onclick = () => {
    const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  };
  const $ = (id) => document.getElementById(id);
  let viz = null;
  fetch("/static/sampler-trace.json").then(r => r.json()).then(t => (viz = SamplerViz.mount($("viz"), t)));
  fetch("/api/info").then(r => r.json()).then(i => {
    for (const m of i.models) { const o = document.createElement("option"); o.value = m.name; o.textContent = m.label || m.name; $("model").appendChild(o); }
    $("model").value = i.default;
  }).catch(() => ($("status").textContent = "Streaming needs the demo server's /api/stream."));

  // POST /api/stream returns one JSON event per line, as tokens are produced.
  $("go").onclick = async () => {
    if (!viz) return;
    $("go").disabled = true;
    const watermark = $("wm").checked, label = $("model").selectedOptions[0]?.textContent || "";
    $("status").textContent = "Starting…";
    let n = 0, t0 = 0;
    try {
      const r = await fetch("/api/stream", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: $("model").value, prompt: $("prompt").value, watermark, max_new_tokens: 200 }) });
      if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const ev = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
          if (ev.type === "start") {
            viz.startLive(ev.context_width, watermark);
            $("status").textContent = ev.loading ? `Loading ${label}…` : "Generating…";
            $("meta").textContent = `Live · ${label} · "${$("prompt").value}"`;
          } else if (ev.type === "token") {
            if (!n) t0 = performance.now();
            n += 1; viz.push(ev.step);
            const dt = (performance.now() - t0) / 1000;
            $("status").textContent = `Streaming · ${n} tokens${dt > 0.3 ? ` · ${(n / dt).toFixed(0)} tok/s` : ""}`;
          } else if (ev.type === "done") {
            viz.endLive();
            $("status").textContent = `Done · ${n} tokens in ${ev.seconds}s${ev.load_seconds > 1 ? ` (+${ev.load_seconds}s load)` : ""} · press Replay to watch it slowly`;
          } else if (ev.type === "error") throw new Error(ev.detail);
        }
      }
    } catch (e) { viz.endLive(); $("status").textContent = `Error: ${e.message}`; }
    $("go").disabled = false;
  };
</script>
</body>
</html>
